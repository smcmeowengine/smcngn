name: Seed Candle Cache
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: axis-scheduled-task
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run seed script
        run: python3 seed_candle_cache.py
      - name: Persist candle cache
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candle_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: seed candle_cache.json [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          else
            echo "No changes to candle_cache.json, nothing to commit."
          fi
