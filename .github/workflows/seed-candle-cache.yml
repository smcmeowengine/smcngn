name: Seed Candle Cache

# This script is meant to be run manually (once), or whenever you need to
# rebuild candle_cache.json (e.g. cache wiped, new symbol added to
# WATCHLIST). It is NOT scheduled automatically, matching the script's
# own "run this ONCE, manually" intent.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you seeding the cache? (optional, for the log)"
        required: false
        default: "manual seed"

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Log run reason
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: echo "Seed reason: $REASON"

      - name: Run seed script
        run: python3 seed_candle_cache.py

      # candle_cache.json is produced/updated by the script. Since GitHub
      # Actions runners are ephemeral, commit the result back to the repo
      # so subsequent live runs (in this workflow or elsewhere) see it.
      - name: Commit updated candle cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candle_cache.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: seed candle_cache.json [skip ci]"
          git push

      # Optional: also upload the cache file as a build artifact, in case
      # you don't want it committed to the repo.
      - name: Upload candle cache as artifact
        uses: actions/upload-artifact@v4
        with:
          name: candle_cache
          path: candle_cache.json
          if-no-files-found: warn
